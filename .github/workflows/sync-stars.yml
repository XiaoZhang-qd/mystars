name: Sync GitHub Stars to HTML Page

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-stars:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 生成 stars.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: XiaoZhang-qd
        run: |
          UPDATE_TIME=$(date -u +"%Y-%m-%d %H:%M UTC")
          ALL_REPOS="[]"
          PAGE=1
          while true; do
            BATCH=$(gh api "users/$USERNAME/starred?per_page=100&page=$PAGE" --jq '[.[] | {full_name, html_url, description, language}]')
            if [ "$BATCH" = "[]" ] || [ -z "$BATCH" ]; then
              break
            fi
            ALL_REPOS=$(echo "$ALL_REPOS" "$BATCH" | jq -s 'add')
            PAGE=$((PAGE + 1))
          done
          jq -n --arg update_time "$UPDATE_TIME" --argjson repos "$ALL_REPOS" '{update_time: $update_time, repos: $repos}' > stars.json

      - name: 提交并推送
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stars.json
          if git diff --cached --quiet; then
            echo "无更新，跳过提交"
            exit 0
          fi
          git commit -m "chore: auto update stars data"
          git push
