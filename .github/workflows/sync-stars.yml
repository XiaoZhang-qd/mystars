name: Sync GitHub Stars to README

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-stars:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 获取 Star 列表并生成 Markdown
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: XiaoZhang-qd
        run: |
          # 生成纯列表内容（不含首尾标记）
          : > stars_content.md
          
          page=1
          while true; do
            repos=$(gh api "users/$USERNAME/starred?per_page=100&page=$page" --jq '.[] | "- [\(.full_name)](\(.html_url)) - \(.description // "无描述")"' 2>/dev/null)
            
            if [ -z "$repos" ]; then
              break
            fi
            
            echo "$repos" >> stars_content.md
            page=$((page + 1))
          done
          
          echo "已获取 $((page - 1)) 页 Star 数据"
          wc -l stars_content.md

      - name: 初始化 README 标记
        run: |
          # 如果 README 不存在，创建基础结构
          if [ ! -f README.md ]; then
            echo "# My GitHub Stars" > README.md
            echo "" >> README.md
          fi
          
          # 如果 README 中没有标记，则追加到末尾
          if ! grep -q "<!-- STARS:START -->" README.md; then
            echo "" >> README.md
            echo "<!-- STARS:START -->" >> README.md
            echo "<!-- STARS:END -->" >> README.md
            echo "已向 README 追加标记位"
          fi

      - name: 更新 README.md
        run: |
          # 使用 awk 安全替换标记之间的内容
          awk '
            /<!-- STARS:START -->/ { print; while ((getline line < "stars_content.md") > 0) print line; skip=1; next }
            /<!-- STARS:END -->/ { print; skip=0; next }
            !skip { print }
          ' README.md > README_new.md
          
          mv README_new.md README.md
          rm -f stars_content.md
          
          echo "更新后的 README 行数："
          wc -l README.md

      - name: 提交并推送更改
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add README.md
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          
          git commit -m "chore: auto update stars list"
          git push
          echo "已成功提交并推送"
