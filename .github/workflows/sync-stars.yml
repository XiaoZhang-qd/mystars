name: Sync GitHub Stars to HTML Page

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-stars:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 生成 stars.json（含语言颜色）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: XiaoZhang-qd
        run: |
          # 下载编程语言颜色表
          curl -sL https://staticdata.dev/v1/programming-languages.json -o lang-colors.json

          # 分页拉取 star 列表
          ALL_REPOS="[]"
          PAGE=1
          while true; do
            BATCH=$(gh api "users/$USERNAME/starred?per_page=100&page=$PAGE" --jq '[.[] | {full_name, html_url, description, language}]')
            if [ "$BATCH" = "[]" ] || [ -z "$BATCH" ]; then
              break
            fi
            ALL_REPOS=$(echo "$ALL_REPOS" "$BATCH" | jq -s 'add')
            PAGE=$((PAGE + 1))
          done

          # 修正：用变量保存当前仓库语言，避免作用域冲突，正确匹配颜色
          ALL_REPOS=$(echo "$ALL_REPOS" | jq --slurpfile colors lang-colors.json '
            map(
              . as $repo |
              . + {
                color: (
                  $colors[0][] | select(.name == $repo.language) | .color
                ) // "#cccccc"
              }
            )
          ')

          # 生成最终 JSON（UTC 标准时间戳）
          UPDATE_TIME=$(date -u +"%Y-%m-%d %H:%M UTC")
          jq -n --arg update_time "$UPDATE_TIME" --argjson repos "$ALL_REPOS" '{update_time: $update_time, repos: $repos}' > stars.json

          rm -f lang-colors.json
          echo "生成完成，共 $(echo "$ALL_REPOS" | jq length) 个仓库"

      - name: 提交并推送
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stars.json
          if git diff --cached --quiet; then
            echo "无更新，跳过提交"
            exit 0
          fi
          git commit -m "chore: auto update stars data"
          git push
